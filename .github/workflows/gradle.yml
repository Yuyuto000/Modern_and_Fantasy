
name: Build Minecraft Forge Mod

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Forge Mod
    runs-on: ubuntu-latest

    steps:
      # リポジトリのソースコードを取得
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Java 17環境を構築
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle環境をセットアップ
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Forge MODをビルド
      - name: Build Forge Mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace --info \
            2>&1 | tee build.log

      # ビルドレポートとログを収集
      - name: Collect Build Reports
        if: always()
        run: |
          mkdir -p artifacts/reports

          if [ -d build/reports ]; then
            cp -r build/reports/. artifacts/reports/
          fi

          if [ -f build.log ]; then
            cp build.log artifacts/reports/
          fi

      # ビルド成果物をArtifactとして保存
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-mod-${{ github.sha }}
          path: |
            build/libs/*.jar
            artifacts/reports/**
          if-no-files-found: warn
          retention-days: 14
